seed = 42
fast_dev_run = false
distributed = false
quantize = false
compile = false

make_dataset = false
make_database = false
tune = false
train = true
evaluate = false

model_id = "answerdotai/ModernBERT-base"
verbose = true

[dataset]
in_path = "/work/jx198/iris_arxiv/data/raw/"
inter_path = "/work/jx198/iris_arxiv/data/intermediate/"
out_path = "/work/jx198/iris_arxiv/data/processed/arxiv11/"
train_size = 0.8
chunk_length = 256
overlap = 32

[dataloader]
batch_size = 64
pin_memory = true
num_workers = 0

[database]
path = "/work/jx198/iris_arxiv/data/db/"
num_partitions = 256
num_sub_vectors = 64
k_neighbors = 4

[model]
num_queries = 8
d_model = 0
nhead = 4
hidden_dim = 512
dropout = 0.1
output_dim = 0
query_ini_random = false
auto_device_map = false

[optimizer]
lr = 1e-3
weight_decay = 1e-5

[trainer]
max_epochs = 10
checkpoint = "/work/jx198/iris_arxiv/checkpoints/arxiv11-one-third-best.pt"
gradient_clip = 1.0
ignore_index = -100
temperature = 1.0
train_fraction = 0.3333333333333333

[tuner]
path = "/work/jx198/iris_arxiv/results/arxiv11-hyperparameters.json"
n_trials = 10
prune = false

[hparams]

[hparams.max_epochs]
name = "max_epochs"
low = 3
high = 20

[hparams.lr]
name = "lr"
low = 1e-5
high = 1e-2

[hparams.weight_decay]
name = "weight_decay"
low = 1e-8
high = 1e-2

[hparams.hidden_dim]
name = "hidden_dim"
low = 7
high = 10

[hparams.dropout]
name = "dropout"
low = 0.0
high = 0.2

[hparams.temperature]
name = "temperature"
low = 0.1
high = 2.0

[evaluator]
path = "/work/jx198/iris_arxiv/results/arxiv11-one-third-results.parquet"
n_bootstraps = 100
